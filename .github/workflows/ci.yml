name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t devops-nginx:${{ github.sha }} app/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t devops-nginx:test app/

      - name: Start container
        run: |
          docker run -d --name devops-nginx -p 8080:8080 devops-nginx:test

      - name: Wait for application
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to become ready"
          docker logs devops-nginx
          exit 1

      - name: Run application health check
        run: ./scripts/healthcheck.sh http://localhost:8080/healthz

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/devops-intern-final:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/devops-intern-final:latest app/

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-intern-final:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devops-intern-final:latest